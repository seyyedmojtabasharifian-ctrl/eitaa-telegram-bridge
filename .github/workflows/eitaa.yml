name: Eitaa to Telegram Bridge

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - main
    paths:
      - "main.py"
      - ".github/workflows/forward.yml"

permissions:
  contents: write

concurrency:
  group: eitaa-telegram-bridge
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Forward Eitaa posts to Telegram
        env:
          EITAA_URL: ${{ secrets.EITAA_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          RESET_SENT_HISTORY_ONCE: ${{ vars.RESET_SENT_HISTORY_ONCE }}
        run: python main.py

      - name: Save delivery state
        if: always()
        run: |
          if [ -f data/seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f data/seen.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram forwarding state [skip ci]"
              git push
            else
              echo "No state changes to save."
            fi
          else
            echo "State file was not created; nothing to save."
          fi
